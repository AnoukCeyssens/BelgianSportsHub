// ======================= helpers =======================
const SCREENS = [['athlete', 'Athlete'], ['calendar', 'Calendar'], ['championship', 'Championship'], ['games', 'Games']];
const PHASES = [['qual', 'Qualification'], ['sel', 'Selection'], ['live', 'Live'], ['after', 'After']];
const VARIANTS = [['A', 'Stepper'], ['B', 'Stacked'], ['C', 'Matrix']];
const P = () => new URLSearchParams(location.search);
const g = (k, d) => P().get(k) ?? d;
const href = (o) => { const p = P(); for (const k in o) o[k] == null ? p.delete(k) : p.set(k, o[k]); return '?' + p.toString(); };
const D = (s) => new Date(s + 'T12:00');
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmt = (s) => D(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtS = (s) => D(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dayDate = (ev, n) => { const d = D(ev.start); d.setDate(d.getDate() + n - 1); return d; };
const dayLbl = (ev, n) => dayDate(ev, n).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const ord = (n) => typeof n !== 'number' ? n : n + ([, 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');
const delta = (e, o) => typeof o === 'number' && e != null ? e - o : null;
const dTxt = (x) => x == null ? '–' : x > 0 ? '+' + x : x < 0 ? '' + x : '=';
const dCls = (x) => x == null ? 'eq' : x > 0 ? 'up' : x < 0 ? 'down' : 'eq';
const ST = { q: 'Qualified', t: 'On track', r: 'At risk', x: 'Not qualified' };
const badge = (s) => `<span class="badge b-${s}">${ST[s]}</span>`;
const mark = (ok) => ok === true ? '<span class="ok">✓</span>' : ok === false ? '<span class="no">✗</span>' : '<span class="pend">…</span>';
const sdot = (sp) => `<span class="dot" style="background:${COL[sp]}"></span>`;
const who = (e) => `${e.who}${e.team ? ' <span class="sub">TEAM</span>' : ''}`;
const MINE = {}; // personal Expectations typed into Selection (in memory only)
const mineInput = (ev, e) => `<input class="mine" type="number" min="1" placeholder="–" value="${MINE[ev.name + e.id] ?? ''}" oninput="MINE['${ev.name}'+'${e.id}']=this.value">`;
const filt = (ev, sports) => sports && sports.length ? ev.entries.filter(e => sports.includes(e.sport)) : ev.entries;
const sportsOf = (ev) => [...new Set(ev.entries.map(e => e.sport))];
const medalsBel = (ev, upto, ids) => { const m = [0, 0, 0]; ev.sessions.filter(s => s.medal && s.d <= upto && (!ids || ids.includes(s.id))).forEach(s => m[s.medal - 1]++); return m; };
const athleteHead = (a) => `<h1>${a.name}</h1><div class="meta">${a.sport} · ${a.event} · born ${fmt(a.born)} · Athlete since ${a.since}</div><div class="sub">${a.ids}</div>`;
const upcomingTbl = (a) => `<table><tr><th>Date</th><th>Competition</th><th>Status</th></tr>${a.upcoming.map(r => `<tr><td>${fmtS(r.date)}<div class="sub">${r.date.slice(0, 4)}</div></td><td>${r.champ ? '<b>' + r.comp + '</b>' : r.comp}<div class="sub">${r.ev}</div></td><td class="sub">${r.note}</td></tr>`).join('')}</table>`;
const resultsTbl = (a) => `<table><tr><th>Date</th><th>Competition</th><th class="n">Place</th><th class="n">Performance</th></tr>${a.results.map(r => `<tr><td>${fmtS(r.date)}<div class="sub">${r.date.slice(0, 4)}</div></td><td>${r.champ ? '<b>' + r.comp + '</b>' : r.comp}<div class="sub">${r.ev}</div></td><td class="n"><b>${ord(r.out)}</b></td><td class="n">${r.perf}</td></tr>`).join('')}</table>`;
const daysUntil = (s) => Math.round((D(s) - D(TODAY)) / 864e5);

// ---- shared phase content blocks (variants differ in how they arrange / navigate them) ----
function qualBlock(ev, es) {
  return `<div class="note">${ev.window} · status curated from the trackers</div><table><tr><th>Entry</th><th>Qualification tracks</th><th>Status</th></tr>
    ${es.map(e => `<tr><td>${ev.games ? sdot(e.sport) : ''}${who(e)}<div class="sub">${e.ev}</div></td><td>${e.tracks.map(t => `<div>${mark(t[3])} ${t[0]} <span class="sub">need ${t[1]} · has ${t[2]}</span></div>`).join('')}</td><td>${badge(e.st)}</td></tr>`).join('')}</table>`;
}
function selBlock(ev, es) {
  const s = es.filter(e => e.sel), out = es.filter(e => !e.sel);
  return `<div class="note">Final list named by ${ev.selector} on ${ev.selDate} · fill in your Expectation (place); locks when the event starts</div>
    <table><tr><th>Entry</th><th class="n">External</th><th class="n">Mine</th></tr>
    ${s.map(e => `<tr><td>${ev.games ? sdot(e.sport) : ''}${who(e)}<div class="sub">${e.ev}${e.roster ? ' · ' + e.roster : ''}</div></td><td class="n">${ord(e.ext)}</td><td class="n">${mineInput(ev, e)}</td></tr>`).join('')}</table>
    ${out.length ? `<p class="sub">Not selected: ${out.map(e => e.who + ' (' + e.ev + ')').join(', ')}</p>` : ''}`;
}
function medalTbl(ev, upto, ids, label) {
  const f = upto / ev.days, b = medalsBel(ev, upto, ids);
  const rows = ev.nations.map(([n, a, s, c]) => [n, Math.round(a * f), Math.round(s * f), Math.round(c * f)]).concat([['Belgium', ...b]])
    .sort((x, y) => y[1] - x[1] || y[2] - x[2] || y[3] - x[3]);
  return `<table><tr><th>#</th><th>${label || 'Medal table'}</th><th class="n"><span class="medal m1">G</span></th><th class="n"><span class="medal m2">S</span></th><th class="n"><span class="medal m3">B</span></th></tr>
    ${rows.map((r, i) => `<tr class="${r[0] === 'Belgium' ? 'bel' : ''}"><td>${i + 1}</td><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td></tr>`).join('')}</table>`;
}
function dayPicker(ev, ids, cur) {
  let h = '';
  for (let n = 1; n <= ev.days; n++) {
    const has = ev.sessions.some(s => s.d === n && (!ids || ids.includes(s.id)));
    h += `<a class="day ${n === cur ? 'on' : ''} ${n < ev.simDay ? 'past' : ''} ${has ? 'has' : ''}" href="${href({ day: n })}">D${n}<b>${dayDate(ev, n).getDate()}</b></a>`;
  }
  return `<div class="scrollx" style="white-space:nowrap">${h}</div>`;
}
function daySessions(ev, ids, n) {
  const ss = ev.sessions.filter(s => s.d === n && (!ids || ids.includes(s.id)));
  const E = (id) => ev.entries.find(e => e.id === id);
  return `<h3>${dayLbl(ev, n)}${n === ev.simDay ? ' · today' : ''}</h3>` + (ss.length ? `<table>${ss.map(s => { const e = E(s.id); return `<tr><td style="width:50px">${s.t}</td><td>${ev.games ? sdot(e.sport) : ''}${who(e)}<div class="sub">${e.ev} · ${s.r}</div></td><td class="n">${n < ev.simDay ? (s.medal ? `<span class="medal m${s.medal}">${'GSB'[s.medal - 1]}</span> ` : '') + '<b>' + s.res + '</b>' : '<span class="sub">' + (n === ev.simDay ? 'today' : 'scheduled') + '</span>'}</td></tr>`; }).join('')}</table>` : '<p class="sub">No Belgian Entries this day.</p>');
}
function liveBlock(ev, es, day) {
  const ids = es.map(e => e.id), n = +day || ev.simDay;
  return `<div class="note">Simulated: today is day ${ev.simDay} (${dayLbl(ev, ev.simDay)})</div>${dayPicker(ev, ids, n)}${daySessions(ev, ids, n)}
    <h3>Medal table after day ${ev.simDay - 1}</h3>${medalTbl(ev, ev.simDay - 1, ids.length < ev.entries.length ? ids : null)}`;
}
function afterBlock(ev, es) {
  const s = es.filter(e => e.sel), ds = s.map(e => delta(+(MINE[ev.name + e.id] || e.ext), e.out));
  const beat = s.filter(e => delta(e.ext, e.out) > 0).length, met = s.filter(e => delta(e.ext, e.out) === 0).length;
  const best = s.filter(e => typeof e.out === 'number').sort((a, b) => a.out - b.out).slice(0, 5);
  return `<h3>Expectation vs outcome</h3><p class="meta">Against external: <b>${beat} beat · ${met} matched · ${s.length - beat - met} short</b></p>
    <table><tr><th>Entry</th><th class="n">Ext.</th><th class="n">Mine</th><th class="n">Out</th><th class="n">±Ext</th><th class="n">±Mine</th></tr>
    ${s.map(e => { const d1 = delta(e.ext, e.out), m = +(MINE[ev.name + e.id] || e.mine), d2 = delta(m, e.out); return `<tr><td>${ev.games ? sdot(e.sport) : ''}${who(e)}<div class="sub">${e.ev}</div></td><td class="n">${e.ext}</td><td class="n">${m}</td><td class="n"><b>${ord(e.out)}</b></td><td class="n ${dCls(d1)}">${dTxt(d1)}</td><td class="n ${dCls(d2)}">${dTxt(d2)}</td></tr>`; }).join('')}</table>
    <h3>Best results</h3><table>${best.map(e => `<tr><td>${e.out <= 3 ? `<span class="medal m${e.out}">${'GSB'[e.out - 1]}</span>` : ord(e.out)}</td><td>${ev.games ? sdot(e.sport) : ''}${who(e)}<div class="sub">${e.ev}</div></td><td class="n">${e.perf}</td></tr>`).join('')}</table>
    <h3>Final medal table</h3>${medalTbl(ev, ev.days, es.length < ev.entries.length ? es.map(e => e.id) : null)}`;
}
const BLOCK = { qual: qualBlock, sel: selBlock, live: liveBlock, after: afterBlock };
const evHead = (ev) => `<h1>${ev.name}</h1><div class="meta">${ev.place} · ${ev.dates}</div>`;

// ---- calendar helpers ----
const monthKey = () => g('month', TODAY.slice(0, 7));
const shiftMonth = (m, k) => { const d = D(m + '-01'); d.setMonth(d.getMonth() + k); return iso(d).slice(0, 7); };
const monthTitle = (m) => D(m + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const daysIn = (m) => { const d = D(m + '-01'); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const legend = (evs) => `<div style="margin:10px 0">${[...new Set(evs.map(e => e.sport))].map(s => `<span class="chip" style="border-color:${COL[s]}">${sdot(s)}${s}</span>`).join('')}<span class="chip" style="font-weight:700">▣ bold = Championship</span></div>`;
const evList = (evs) => `<table>${evs.map(e => `<tr><td style="width:90px">${fmtS(e.s)}${e.e !== e.s ? '–' + fmtS(e.e) : ''}</td><td>${sdot(e.sport)}${e.champ ? '<b>' + e.name + '</b>' : e.name}<div class="sub">${e.sport} · ${e.who}</div></td></tr>`).join('')}</table>`;
const inMonth = (m) => CAL.filter(e => e.s.slice(0, 7) <= m && e.e.slice(0, 7) >= m);
const monthNav = (m) => `<div class="mhead"><a href="${href({ month: shiftMonth(m, -1) })}">‹</a><h1 style="margin:0">${monthTitle(m)}</h1><a href="${href({ month: shiftMonth(m, 1) })}">›</a></div>`;

// ======================= VARIANT A — STEPPER =======================
const A = {
  athlete() {
    const a = ATHLETE;
    return athleteHead(a) + `<div class="twocol">${a.targets.map(t => `<div><h2>${t.label} · ${t.name}</h2>
      <div style="margin-bottom:6px">${badge(t.status)} <span class="sub">${t.dates} · ${t.window}</span></div>
      <div class="ladder">${t.tracks.map(r => `<div class="k">${r.k}</div><div>${mark(r.st === 'ok' ? true : r.st === 'no' ? false : null)} <b>${r.need}</b><br><span class="sub">${r.has}</span></div>`).join('')}</div></div>`).join('')}</div>
      <h2>Upcoming</h2>${upcomingTbl(a)}<h2>Results</h2>${resultsTbl(a)}`;
  },
  calendar() {
    // Classic month grid; multi-day events are bars spanning their days, wrapping across weeks.
    const m = monthKey(), first = D(m + '-01'), off = (first.getDay() + 6) % 7;
    const start = new Date(first); start.setDate(1 - off);
    let h = monthNav(m) + `<div class="dow">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div>${x}</div>`).join('')}</div>`;
    for (let w = 0; w < 6; w++) {
      const ws = new Date(start); ws.setDate(start.getDate() + w * 7);
      if (w > 0 && iso(ws).slice(0, 7) > m) break;
      const days = [...Array(7)].map((_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return iso(d); });
      const evs = CAL.filter(e => e.s <= days[6] && e.e >= days[0]).sort((a, b) => a.s.localeCompare(b.s));
      const lanes = []; let bars = '';
      evs.forEach(e => {
        const c0 = Math.max(0, days.indexOf(e.s) < 0 ? 0 : days.indexOf(e.s)), c1 = days.indexOf(e.e) < 0 ? 6 : days.indexOf(e.e);
        let l = 0; while ((lanes[l] || []).some(([a, b]) => !(c1 < a || c0 > b))) l++; (lanes[l] = lanes[l] || []).push([c0, c1]);
        bars += `<div class="ev ${e.champ ? 'champ' : ''} ${e.s < days[0] ? 'cl' : ''} ${e.e > days[6] ? 'cr' : ''}" title="${e.name}" style="background:${COL[e.sport]};grid-column:${c0 + 1}/${c1 + 2};grid-row:${l + 2}">${e.s < days[0] ? '← ' : ''}${e.name}</div>`;
      });
      h += `<div class="week">${days.map((d, i) => `<div class="dn ${d.slice(0, 7) !== m ? 'out' : ''} ${d === TODAY ? 'today' : ''}" style="grid-column:${i + 1}">${+d.slice(8)}</div>`).join('')}${bars}</div>`;
    }
    return h + legend(inMonth(m)) + `<h2>This month</h2>` + evList(inMonth(m)) + `<p class="sub">↧ Subscribe (iCal)</p>`;
  },
  event(ev) {
    // One phase at a time behind a stepper; the current real-world phase is marked "now". Games: sport chips.
    const ph = g('phase', ev.current), sp = ev.games ? (g('sport', '') ? g('sport').split(',') : []) : [];
    const es = filt(ev, sp);
    const chips = ev.games ? `<div style="margin-top:10px"><a class="chip ${!sp.length ? 'on' : ''}" href="${href({ sport: null })}">All sports</a>${sportsOf(ev).map(s => `<a class="chip ${sp.includes(s) ? 'on' : ''}" href="${href({ sport: sp.includes(s) ? sp.filter(x => x !== s).join(',') || null : [...sp, s].join(',') })}">${sdot(s)}${s}</a>`).join('')}</div>` : '';
    return evHead(ev) + `<div class="stepper">${PHASES.map(([k, l]) => `<a class="${k === ph ? 'on' : ''}" href="${href({ phase: k, day: null })}">${l}${k === ev.current ? '<span class="now">● now</span>' : '<span class="now">&nbsp;</span>'}</a>`).join('')}</div>` + chips + BLOCK[ph](ev, es, g('day'));
  },
};

// ======================= VARIANT B — STACKED =======================
const B = {
  athlete() {
    // Both targets in one combined table, grouped by target.
    const a = ATHLETE;
    return athleteHead(a) + `<h2>Qualification</h2><table><tr><th>Track</th><th>Need</th><th>Has</th><th></th></tr>
      ${a.targets.map(t => `<tr class="grp"><td colspan="4">${t.label}: ${t.name} · ${t.dates} &nbsp; ${badge(t.status)}<div class="sub" style="font-weight:400">${t.window} · closes in ${daysUntil(t.closes)} days</div></td></tr>
      ${t.tracks.map(r => `<tr><td>${r.k}</td><td>${r.need}</td><td class="sub">${r.has}</td><td>${mark(r.st === 'ok' ? true : r.st === 'no' ? false : null)}</td></tr>`).join('')}`).join('')}</table>
      <h2>Upcoming</h2>${upcomingTbl(a)}<h2>Results</h2>${resultsTbl(a)}`;
  },
  calendar() {
    // Month as sport lanes: one row per sport, days across, events as bars spanning their days.
    const m = monthKey(), N = daysIn(m), evs = inMonth(m), sports = [...new Set(evs.map(e => e.sport))];
    let h = `<div class="lanes" style="grid-template-columns:96px repeat(${N}, 1fr)"><div class="lh"></div>`;
    for (let d = 1; d <= N; d++) { const ds = m + '-' + String(d).padStart(2, '0'), wd = D(ds).getDay(); h += `<div class="lh ${wd === 0 || wd === 6 ? 'we' : ''} ${ds === TODAY ? 'today' : ''}">${'SMTWTFS'[wd]}<br>${d}</div>`; }
    sports.forEach((s, i) => {
      const row = i + 2;
      h += `<div class="sp" style="grid-row:${row};border-left:4px solid ${COL[s]}">${s}</div>`;
      for (let d = 1; d <= N; d++) h += `<div class="cell" style="grid-row:${row};grid-column:${d + 1}"></div>`;
      evs.filter(e => e.sport === s).forEach(e => {
        const a = e.s.slice(0, 7) < m ? 1 : +e.s.slice(8), b = e.e.slice(0, 7) > m ? N : +e.e.slice(8);
        h += `<div class="ev ${e.champ ? 'champ' : ''}" title="${e.name}" style="background:${COL[s]};grid-row:${row};grid-column:${a + 1}/${b + 2}">${e.name}</div>`;
      });
    });
    return monthNav(m) + `<p class="sub">One row per sport · scroll sideways on a phone</p><div class="scrollx">${h}</div></div>` + `<h2>This month</h2>` + evList(evs);
  },
  event(ev) {
    // All four phases on one page as collapsible sections; the current one is open, later ones greyed. Games: dropdown filter.
    const open = g('phase', ev.current), sp = ev.games ? g('sport', '') : '';
    const es = filt(ev, sp ? [sp] : []);
    const idx = PHASES.findIndex(p => p[0] === ev.current);
    const sum = { qual: `${es.filter(e => e.st === 'q').length} qualified · ${es.filter(e => e.st === 't').length} on track · ${es.filter(e => e.st === 'r').length} at risk`,
      sel: `${es.filter(e => e.sel).length} selected by ${ev.selector}`, live: `day ${ev.simDay} of ${ev.days}`,
      after: (() => { const m = medalsBel(ev, ev.days, sp ? es.map(e => e.id) : null); return `${m[0]} gold · ${m[1]} silver · ${m[2]} bronze`; })() };
    const filter = ev.games ? `<div style="margin:10px 0">Showing <select onchange="location.search='${href({ sport: '__' })}'.replace('__',encodeURIComponent(this.value)).replace(/sport=(&|$)/,'')"><option value="">All sports combined</option>${sportsOf(ev).map(s => `<option ${s === sp ? 'selected' : ''}>${s}</option>`).join('')}</select></div>` : '';
    return evHead(ev) + filter + PHASES.map(([k, l], i) => `<details class="ph ${i > idx ? 'future' : ''}" ${k === open ? 'open' : ''}><summary><b>${l}</b><span class="sub">${k === ev.current ? '● now · ' : i > idx ? 'later · ' : ''}${sum[k]}</span></summary>${BLOCK[k](ev, es, g('day'))}</details>`).join('');
  },
};

// ======================= VARIANT C — MATRIX =======================
const C = {
  athlete() {
    // Segmented switch between the two targets; each track as a progress bar toward its requirement.
    const a = ATHLETE, tk = g('target', 'oly'), t = a.targets.find(x => x.key === tk) || a.targets[0];
    return athleteHead(a) + `<h2>Qualification</h2><div class="seg">${a.targets.map(x => `<a class="${x.key === t.key ? 'on' : ''}" href="${href({ target: x.key })}">${x.label}<br><span style="font-weight:400">${x.name}</span></a>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">${badge(t.status)}<span class="sub">${t.dates} · window closes in <b>${daysUntil(t.closes)}</b> days</span></div>
      ${t.tracks.map(r => `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>${r.k}</span><span class="sub">${r.need}</span></div><div class="bar"><i style="width:${r.pct}%;background:${r.st === 'ok' ? '#1b7a35' : '#8a6d1d'}"></i></div><div class="sub">${r.has}</div></div>`).join('')}
      <h2>Upcoming</h2>${upcomingTbl(a)}<h2>Results</h2>${resultsTbl(a)}`;
  },
  calendar() {
    // Year planner: four months stacked, days 1–31 across; each day cell is filled with the colour(s) of the sports on that day.
    const m0 = monthKey(); let h = `<div class="plan"><div></div>${[...Array(31)].map((_, i) => `<div class="hd">${i + 1}</div>`).join('')}`;
    const months = [0, 1, 2, 3].map(k => shiftMonth(m0, k)); const shown = new Set();
    months.forEach(m => {
      h += `<div class="ml">${D(m + '-01').toLocaleDateString('en-GB', { month: 'short' })}</div>`;
      for (let d = 1; d <= 31; d++) {
        if (d > daysIn(m)) { h += '<div class="c na"></div>'; continue; }
        const ds = m + '-' + String(d).padStart(2, '0'), wd = D(ds).getDay();
        const evs = CAL.filter(e => e.s <= ds && e.e >= ds); evs.forEach(e => shown.add(e));
        const bg = evs.length ? `background:linear-gradient(${evs.map((e, i) => `${COL[e.sport]} ${i / evs.length * 100}% ${(i + 1) / evs.length * 100}%`).join(',')})` : '';
        h += `<div class="c ${wd === 0 || wd === 6 ? 'we' : ''} ${evs.some(e => e.champ) ? 'champ' : ''} ${ds === TODAY ? 'today' : ''}" title="${evs.map(e => e.name).join(' / ')}" style="${bg}"></div>`;
      }
    });
    const list = [...shown].sort((a, b) => a.s.localeCompare(b.s));
    return `<div class="mhead"><a href="${href({ month: shiftMonth(m0, -1) })}">‹</a><h1 style="margin:0">${monthTitle(m0).split(' ')[0]} – ${monthTitle(months[3])}</h1><a href="${href({ month: shiftMonth(m0, 1) })}">›</a></div>
      <p class="sub">Four months at a glance · outlined = Championship day · red line = today</p>${h}</div>` + legend(list) + `<h2>In view</h2>` + evList(list);
  },
  event(ev) {
    // Entries down, phases across: follow every Athlete/Team through Qualification → Selection → Live → After.
    // The chosen column header opens its phase-wide panel below. Games: per-sport toggles, grouped rows.
    const ph = g('phase', ev.current), allS = sportsOf(ev), on = ev.games ? (g('sports') ? g('sports').split(',') : allS) : allS;
    const es = filt(ev, on), n = +g('day', ev.simDay);
    const cell = {
      qual: (e) => `${badge(e.st)}<div class="sub">${e.tracks.map(t => mark(t[3]) + ' ' + t[0]).join('<br>')}</div>`,
      sel: (e) => e.sel ? `✓ selected<div>mine ${mineInput(ev, e)} <span class="sub">ext ${ord(e.ext)}</span></div>` : '<span class="sub">not selected</span>',
      live: (e) => { if (!e.sel) return ''; const ss = ev.sessions.filter(s => s.id === e.id); const last = ss.filter(s => s.d < ev.simDay).pop(), next = ss.find(s => s.d >= ev.simDay);
        return (last ? `<b>${last.res}</b><div class="sub">${last.r} · D${last.d}</div>` : '') + (next ? `<div class="sub">next: ${next.r} · D${next.d} ${next.t}</div>` : ''); },
      after: (e) => { if (!e.sel) return ''; const d = delta(e.ext, e.out); return `<b>${ord(e.out)}</b> <span class="${dCls(d)}">${dTxt(d)}</span><div class="sub">exp ${e.ext} · mine ${MINE[ev.name + e.id] || e.mine}</div>`; },
    };
    const toggles = ev.games ? `<div style="margin:10px 0">${allS.map(s => { const nx = on.includes(s) ? on.filter(x => x !== s) : [...on, s]; return `<a class="chip ${on.includes(s) ? 'on' : ''}" href="${href({ sports: nx.length === allS.length ? null : nx.join(',') || allS[0] })}">${sdot(s)}${s}</a>`; }).join('')}<a class="chip" href="${href({ sports: null })}">all</a></div>` : '';
    const groups = ev.games ? on.map(s => [s, es.filter(e => e.sport === s)]) : [[null, es]];
    const rows = groups.map(([s, list]) => (s ? `<tr class="grp"><td colspan="5">${sdot(s)}${s}</td></tr>` : '') + list.map(e => `<tr><td>${who(e)}<div class="sub">${e.ev}</div></td>${PHASES.map(([k]) => `<td class="${k === ph ? 'sel' : ''}">${cell[k](e)}</td>`).join('')}</tr>`).join('')).join('');
    const ids = es.map(e => e.id), filtered = es.length < ev.entries.length ? ids : null;
    const panel = { qual: `<h2>Qualification · ${ev.window}</h2><p class="meta">${es.filter(e => e.st === 'q').length} qualified · ${es.filter(e => e.st === 't').length} on track · ${es.filter(e => e.st === 'r').length} at risk · ${es.filter(e => e.st === 'x').length} out</p>`,
      sel: `<h2>Selection · ${ev.selector}, ${ev.selDate}</h2><p class="meta">Type your Expectations in the column above; they lock when the event starts.</p>`,
      live: `<h2>Live · day by day</h2>${dayPicker(ev, ids, n)}${daySessions(ev, ids, n)}<h3>Medal table after day ${ev.simDay - 1}</h3>${medalTbl(ev, ev.simDay - 1, filtered)}`,
      after: `<h2>After</h2>` + afterBlock(ev, es) };
    return evHead(ev) + toggles + `<div class="scrollx"><table class="matrix"><tr><th>Entry</th>${PHASES.map(([k, l]) => `<th class="${k === ph ? 'sel' : ''}"><a href="${href({ phase: k })}">${l}${k === ev.current ? ' ●' : ''}</a></th>`).join('')}</tr>${rows}</table></div>` + panel[ph];
  },
};

// ======================= router + switcher =======================
const R = { A, B, C };
function render() {
  const v = g('variant', 'A'), s = g('screen', 'athlete'), V = R[v] || A;
  const body = s === 'championship' ? V.event(CHAMP) : s === 'games' ? V.event(GAMES) : V[s]();
  document.getElementById('app').innerHTML = `<div class="wrap">${body}</div><nav class="tabs">${SCREENS.map(([k, l]) => `<a href="${href({ screen: k, phase: null, day: null })}" class="${k === s ? 'on' : ''}">${l}</a>`).join('')}</nav>`;
  document.getElementById('label').textContent = `${v} · ${(VARIANTS.find(x => x[0] === v) || VARIANTS[0])[1]}`;
}
function step(dir) {
  const i = VARIANTS.findIndex(x => x[0] === g('variant', 'A'));
  history.replaceState(null, '', href({ variant: VARIANTS[(i + dir + 3) % 3][0] })); render();
}
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', (e) => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
render();
</script>
</body>
