        <div class="k">BOIC selection</div><div><b>${q.boic.label}</b><br><span class="sub">${q.boic.detail}</span></div>
      </div>
      <h2>Upcoming</h2>
      <table><tr><th>Date</th><th>Competition</th><th class="n">Ext.</th><th class="n">Mine</th></tr>
      ${a.upcoming.map(r => `<tr><td>${fmtS(r.date)}<div class="sub">${r.date.slice(0,4)}</div></td><td class="${r.champ?'champ':''}">${r.comp}<div class="sub">${r.ev} · ${r.note}</div></td><td class="n">${r.ext ?? '–'}</td><td class="n">${r.mine ?? '<u>pick</u>'}</td></tr>`).join('')}
      </table>
      <h2>Results · Expectation vs outcome</h2>
      <table><tr><th>Date</th><th>Competition</th><th class="n">Ext.</th><th class="n">Mine</th><th class="n">Out</th><th class="n">±Ext</th></tr>
      ${a.results.map(r => { const d = delta(r.ext, r.out); return `<tr><td>${fmtS(r.date)}<div class="sub">${r.date.slice(0,4)}</div></td><td class="${r.champ?'champ':''}">${r.comp}<div class="sub">${r.ev} · ${r.perf}</div></td><td class="n">${r.ext}</td><td class="n">${r.mine}</td><td class="n"><b>${r.out}</b></td><td class="n ${dCls(d)}">${dTxt(d)}</td></tr>`; }).join('')}
      <tr><td></td><td class="sub">Season record vs external Expectation</td><td colspan="4" class="n"><b>1 beat · 0 matched · 3 short</b></td></tr>
      </table>
      <p class="sub" style="font-family:sans-serif">${a.updated}</p>`;
  },
  calendar() {
    let wk = '';
    return `<h1>Calendar</h1><div class="meta">Belgian Entries, next 10 weeks · <b>bold</b> = Championship</div>` +
      CAL.map(e => {
        const w = 'Week of ' + fmtS(e.d); const head = w !== wk ? `<div class="wk">${w}</div>` : ''; wk = w;
        return head + `<table><tr><td style="width:80px">${fmtS(e.d)}${e.end ? '–<br>' + fmtS(e.end) : ''}</td><td class="${e.champ?'champ':''}">${e.comp}<div class="sub">${e.sport} · ${e.who}</div></td></tr></table>`;
      }).join('') + `<p class="sub" style="font-family:sans-serif">↧ Subscribe (iCal) · Filter: All sports ▾</p>`;
  },
  championship() {
    const c = CHAMP;
    return `<h1>${c.name}</h1><div class="meta">${c.place} · ${c.dates} · ${c.status} · Belgium: ${c.medals.g} gold, ${c.medals.s} silver, ${c.medals.b} bronze</div>
      <h2>Belgian Entries</h2>
      <table><tr><th>Day</th><th>Event / Entry</th><th class="n">Ext.</th><th class="n">Mine</th><th class="n">Out</th><th class="n">±</th></tr>
      ${c.entries.map(e => { const d = delta(e.ext, e.out); return `<tr><td>${e.day}</td><td>${e.who}${e.team ? ' <span class="tag">TEAM</span>' : ''}<div class="sub">${e.ev} · ${e.perf}${e.roster ? '<br>Roster: ' + e.roster : ''}</div></td><td class="n">${e.ext}</td><td class="n">${e.mine}</td><td class="n"><b>${e.out}</b></td><td class="n ${dCls(d)}">${dTxt(d)}</td></tr>`; }).join('')}
      </table>`;
  },
  games() {
    const g = GAMES;
    return `<h1>${g.name} · day by day</h1><div class="meta">Expected Belgian Entries per day · status = qualification status today · scroll →</div>
      <div class="gridscroll"><table class="sched"><tr>${g.days.map(d => `<th>Day ${d.n}<br>${d.key} Jul</th>`).join('')}</tr>
      <tr>${g.days.map(d => `<td>${d.items.length ? d.items.map(i => `<div style="margin-bottom:8px"><b>${i.t}</b> ${i.ev}<br>${i.who}<br><span class="tag" style="color:${i.st==='g'?'#1b7a35':i.st==='y'?'#8a6d1d':'#b3261e'}">${i.stl}</span>${i.ext ? ' <span class="sub">exp ' + ord(i.ext) + '</span>' : ''}</div>`).join('') : '<span class="sub">No Belgians</span>'}</td>`).join('')}</tr></table></div>`;
  },
  render(s) {
    return `<div class="vA"><div class="wrap">${this[s]()}</div>
      <nav class="tabs">${SCREENS.map(([k, l]) => `<a href="${href({ screen: k })}" class="${k===s?'on':''}">${l}</a>`).join('')}</nav></div>`;
  },
};

// ======================= VARIANT B — TIMELINE =======================
const B = {
  track(ext, mine, out, n = 8) {
    const pos = (v) => typeof v === 'number' ? Math.min(v, n) / n * 92 + 4 : 96;
    return `<div class="exp"><span style="width:28px;color:#8aa0b4">1st</span><div class="track">
      ${ext != null ? `<span class="e" style="left:${pos(ext)}%">${ext}</span>` : ''}
      ${mine != null ? `<span class="p" style="left:${pos(mine)}%">${mine}</span>` : ''}
      ${out != null ? `<span class="o" style="left:${pos(out)}%">${typeof out === 'number' ? out : '×'}</span>` : ''}
      </div><span style="width:28px;color:#8aa0b4;text-align:right">${n}th</span></div>`;
  },
  legend: `<div class="legend"><span><i style="background:#5b7a96"></i>External</span><span><i style="background:#a77bff"></i>My pick</span><span><i style="background:#ffd23f"></i>Outcome</span></div>`,
  athlete() {
    const a = ATHLETE, q = a.qual;
    const items = [...a.upcoming.slice().reverse().map(r => ({ ...r, past: false })), { now: true }, ...a.results.map(r => ({ ...r, past: true }))];
    return `<div class="hero"><h1>${a.name}</h1><p>${a.event} · World #${a.worldRank} · SB ${a.sb}</p></div>
      <div class="quals">
        <div class="${q.quota.state}"><b>Quota place</b>${q.quota.label}</div>
        <div class="${q.path.state}"><b>Athlete path</b>${q.path.label}</div>
        <div class="${q.boic.state}"><b>BOIC</b>${q.boic.label}</div>
      </div>
      ${this.legend}
      <div class="river">${items.map(r => r.now ? `<div class="node now"><div class="nowbar">━━ TODAY · ${fmtS(TODAY)} ━━</div></div>` : `
        <div class="node ${r.past ? 'past' : ''} ${r.champ ? 'big' : ''}">
          <div class="date">${fmt(r.date)}</div>
          <div class="title">${r.comp}</div>
          <div class="line">${r.ev}${r.past ? ` · <b>${ord(r.out)}</b> · ${r.perf}` : ` · ${r.note}`}</div>
          ${this.track(r.ext, r.mine, r.past ? r.out : null)}
        </div>`).join('')}</div>`;
  },
  calendar() {
    return `<div class="hero"><h1>What's next</h1><p>Belgian Entries from today · Championships in yellow</p></div>
      <div class="river"><div class="node now"><div class="nowbar">━━ TODAY · ${fmtS(TODAY)} ━━</div></div>
      ${CAL.map(e => `<div class="node ${e.champ ? 'big' : ''}"><div class="date">${fmtS(e.d)}${e.end ? ' – ' + fmtS(e.end) : ''} · ${e.sport}</div><div class="title">${e.comp}</div><div class="line">${e.who}</div></div>`).join('')}</div>`;
  },
  championship() {
    const c = CHAMP;
    return `<div class="hero"><h1>${c.name}</h1><p>${c.place} · ${c.dates} · 🥇${c.medals.g} 🥈${c.medals.s} 🥉${c.medals.b}</p></div>
      ${this.legend}
      <div class="river">${c.entries.map(e => `<div class="node past ${typeof e.out === 'number' && e.out <= 3 ? 'big' : ''}">
        <div class="date">${e.day} Aug · ${e.ev}</div>
        <div class="title">${e.who} · ${ord(e.out)}${e.team ? ' <span class="chip y">Team</span>' : ''}</div>
        <div class="line">${e.perf}${e.roster ? ' · ' + e.roster : ''}</div>
        ${this.track(e.ext, e.mine, e.out)}</div>`).join('')}</div>`;
  },
  games(day) {
    const g = GAMES, d = g.days.find(x => x.key === day) || g.days[0];
    return `<div class="hero"><h1>${g.name}</h1><p>Opening ${g.start} · swipe the days · expected Belgian Entries</p></div>
      <div class="days">${g.days.map(x => `<a href="${href({ day: x.key })}" class="${x.key===d.key?'on':''}">Day ${x.n}<b>${x.key.split(' ')[1]}</b>${x.key.split(' ')[0]}<span class="dot" style="background:${x.items.length ? '#3ddc84' : 'transparent'}"></span></a>`).join('')}</div>
      <div class="river">${d.items.length ? d.items.map(i => `<div class="node"><div class="date">${i.t} local</div><div class="title">${i.ev}</div><div class="line">${i.who} <span class="chip ${i.st}">${i.stl}</span></div>${i.ext ? `<div class="line" style="color:#8aa0b4;margin-top:4px">External Expectation: ${ord(i.ext)} · <u>add my pick</u></div>` : ''}</div>`).join('') : '<div class="node"><div class="line">No Belgian Entries this day.</div></div>'}</div>`;
  },
  render(s, day) {
    return `<div class="vB"><div class="top"><div class="seg">${SCREENS.map(([k, l]) => `<a href="${href({ screen: k })}" class="${k===s?'on':''}">${l}</a>`).join('')}</div></div>
      <div class="wrap">${this[s](day)}</div></div>`;
  },
};

// ======================= VARIANT C — SCOREBOARD =======================
const C = {
  athlete() {
    const a = ATHLETE, q = a.qual;
    const beat = a.results.filter(r => delta(r.ext, r.out) > 0).length, short = a.results.filter(r => delta(r.ext, r.out) < 0).length;
    const lc = (s) => s === 'ok' ? 'g' : s === 'wait' ? 'y' : 'x';
    return `<div class="heroC"><div><h1>${a.name}</h1><p>${a.event} · ${a.sport}</p></div><div style="text-align:right"><div class="big">#${a.worldRank}</div><p>World Ranking</p></div></div>
      <div class="grid" style="margin-top:12px">
        <div class="card"><h3>Road to ${q.cycle}</h3>
          <div class="lights">
            <div class="light ${lc(q.quota.state)}"><i></i>Quota place<br><span style="font-weight:400">${q.quota.label}</span></div>
            <div class="light ${lc(q.path.state)}"><i></i>Athlete path<br><span style="font-weight:400">${q.path.label}</span></div>
            <div class="light ${lc(q.boic.state)}"><i></i>BOIC<br><span style="font-weight:400">${q.boic.label}</span></div>
          </div><p style="font-size:12px;color:#555;margin:10px 0 0">${q.quota.detail}</p></div>
        <div class="card"><h3>Next up</h3><div style="font-weight:800;font-size:18px">${a.upcoming[0].comp}</div><div style="font-size:13px;color:#555">${fmt(a.upcoming[0].date)} · ${a.upcoming[0].ev}</div>
          <button style="margin-top:10px;background:#e30613;color:#fff;border:0;padding:10px 14px;font-weight:800;border-radius:3px">Make my pick</button></div>
        <div class="card" style="grid-column:1/-1"><h3>Expectation vs outcome · last 4</h3>
          <div style="display:flex;gap:18px;margin-bottom:10px"><div><div class="big" style="color:#1db954">${beat}</div><small>beat</small></div><div><div class="big" style="color:#e30613">${short}</div><small>short</small></div></div>
          <div class="score"><span class="h">Competition</span><span class="h">Ext</span><span class="h">Out</span><span class="h">±</span>
          ${a.results.map(r => { const d = delta(r.ext, r.out); return `<span><b>${r.comp}</b><br><small>${fmtS(r.date)} ${r.date.slice(0,4)} · ${r.perf} · my pick ${r.mine}</small></span><span>${r.ext}</span><span><b>${r.out}</b></span><span class="pill ${dCls(d)}">${dTxt(d)}</span>`; }).join('')}
          </div></div>
      </div>`;
  },
  calendar() {
    const first = new Date('2026-11-01T12:00'); const off = (first.getDay() + 6) % 7; const cells = [];
    for (let i = 0; i < off; i++) cells.push('<div></div>');
    for (let d = 1; d <= 30; d++) {
      const ds = '2026-11-' + String(d).padStart(2, '0');
      const evs = CAL.filter(e => e.d <= ds && (e.end || e.d) >= ds);
      cells.push(`<div class="${ds === TODAY ? 'today' : ''}"><b>${d}</b>${evs.map(e => `<div class="ev ${e.champ ? 'c' : ''}">${e.sport}</div>`).join('')}</div>`);
    }
    return `<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">November 2026</h2><span>‹ ›</span></div>
      <div class="month" style="margin-top:8px">${['M','T','W','T','F','S','S'].map(x => `<div class="dh">${x}</div>`).join('')}${cells.join('')}</div>
      <div class="grid grid3" style="margin-top:14px">${CAL.slice(0, 6).map(e => `<div class="tile"><div class="ev">${fmtS(e.d)} · ${e.sport}${e.champ ? ' · <span style="color:#e30613">Championship</span>' : ''}</div><div class="who">${e.comp}</div><div style="font-size:12px">${e.who}</div></div>`).join('')}</div>`;
  },
  championship() {
    const c = CHAMP;
    return `<div class="heroC"><div><h1>${c.name}</h1><p>${c.place} · ${c.dates} · ${c.status}</p></div></div>
      <div class="card" style="margin:12px 0"><h3>Belgium medal count</h3><div class="medals"><span><span class="medal m1">G</span> ${c.medals.g}</span><span><span class="medal m2">S</span> ${c.medals.s}</span><span><span class="medal m3">B</span> ${c.medals.b}</span></div></div>
      <div class="grid grid3">${c.entries.map(e => { const d = delta(e.ext, e.out); return `<div class="tile">
        <div class="ev">${e.ev} · ${e.day}</div>
        <div class="who">${typeof e.out === 'number' && e.out <= 3 ? `<span class="medal m${e.out}">${e.out}</span> ` : ''}${e.who}</div>
        ${e.roster ? `<div style="font-size:11px;color:#555">Team · ${e.roster}</div>` : ''}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px"><span>Exp ${ord(e.ext)} → <b>${ord(e.out)}</b></span><span class="pill ${dCls(d)}">${dTxt(d)}</span></div></div>`; }).join('')}</div>`;
  },
  games(day) {
    const g = GAMES, d = g.days.find(x => x.key === day) || g.days[0];
    return `<div class="heroC"><div><h1>${g.name}</h1><p>Day ${d.n} · ${d.key} Jul 2028 · ${d.items.length} Belgian Entries expected</p></div><div style="text-align:right"><div class="big">${g.days.reduce((s, x) => s + x.items.length, 0)}</div><p>Entries in view</p></div></div>
      <div class="daypills" style="margin-top:12px">${g.days.map(x => `<a href="${href({ day: x.key })}" class="${x.key===d.key?'on':''}">D${x.n} · ${x.key}</a>`).join('')}</div>
      <div class="nownext">${d.items.length ? d.items.map(i => `<div class="slot"><span class="t">${i.t}</span><span><b>${i.who}</b><br><small>${i.ev}</small></span><span style="text-align:right"><span class="st ${i.st}">${i.stl}</span>${i.ext ? `<br><small>exp ${ord(i.ext)}</small>` : ''}</span></div>`).join('') : '<p>No Belgian Entries this day.</p>'}</div>`;
  },
  render(s, day) {
    return `<div class="vC"><div class="bar"><button class="burger" onclick="document.querySelector('.drawer').classList.add('open')">☰</button><b>${SCREENS.find(x => x[0] === s)[1]}</b></div>
      <div class="drawer" onclick="this.classList.remove('open')"><nav>${SCREENS.map(([k, l]) => `<a href="${href({ screen: k })}" class="${k===s?'on':''}">${l}</a>`).join('')}</nav></div>
      <div class="wrap">${this[s](day)}</div></div>`;
  },
};

// ======================= switcher =======================
const R = { A, B, C };
function render() {
  const { v, s, day } = cur();
  document.getElementById('app').innerHTML = (R[v] || A).render(s, day);
  const name = (VARIANTS.find(x => x[0] === v) || VARIANTS[0])[1];
  document.getElementById('label').textContent = `${v} (${name}) · ${s}`;
}
function step(dir) {
  const i = VARIANTS.findIndex(x => x[0] === cur().v);
  const n = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0];
  history.replaceState(null, '', href({ variant: n })); render();
}
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
render();
</script>
</body>
