<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Curation workspace</title>
<!--
  PROTOTYPE, throwaway, never merged. Wayfinder ticket "Curation workspace prototype" (#19).
  Question: how should the owner's curation side look and behave so the weekly session (~2–3.5 h)
  and the daily Live pass are fast?
  Three structurally different variants on one page, switchable via ?variant=A|B|C, plus ?mode=weekly|live.
    A  Run sheet    — a guided, linear session: one step (task type) at a time, in a fixed order.
    B  Inbox        — every pending thing in one urgency-sorted queue, keyboard-driven, one item at a time.
    C  Sport board  — a grid of sports × task types; open a cell to work that sport's slice.
  All data is mock (13 Nov 2026). State is in memory only; reload resets it.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
button.ghost{background:transparent}
button.small{padding:2px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
textarea{width:100%;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
input.url{width:100%}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
h1,h2,h3,h4{margin:0}
.muted{color:var(--muted)}
.warn{color:var(--warn)}
.bad{color:var(--bad)}
.okc{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:8px}
.tool{display:block}
.tool label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
.maps{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.maps label{display:flex;flex-direction:column;margin:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.stale{background:var(--warn)}.dot.blocked{background:var(--bad)}
.st{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.st-qualified,.st-selected{color:var(--ok)}
.st-on-track,.st-eligible{color:var(--accent2)}
.st-at-risk{color:var(--warn)}
.st-not-in-contention,.st-not-selected,.st-withdrawn{color:var(--muted)}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--tagbg);color:var(--tagink);white-space:nowrap}
.src{font-size:12px;color:var(--muted)}
.arrow{color:var(--muted);padding:0 4px}
.match-ok{color:var(--ok);font-size:12px}
.match-no{color:var(--warn);font-size:12px}
.cand{border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.incoming{border-left:3px solid var(--accent);padding:6px 10px;background:var(--field)}
.log{font-size:12px;max-height:220px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dotted var(--line)}
.notdue{font-size:12px;color:var(--muted)}
.mock{font-size:11px;color:var(--muted);font-style:italic}

/* ---------- floating switcher (prototype chrome, not part of any design) ---------- */
#switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:6px;align-items:center;
  background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:13px -apple-system,system-ui,sans-serif;white-space:nowrap}
#switcher button{background:#2a2a2a;color:#fff;border:0;border-radius:999px;padding:4px 10px}
#switcher button.on{background:#ffd43b;color:#111}
#switcher .lbl{min-width:150px;text-align:center;font-weight:600}
#switcher .sep{width:1px;height:18px;background:#444;margin:0 4px}

/* ================= Variant A — Run sheet ================= */
body.vA{--bg:#f3f1ec;--panel:#fff;--field:#faf9f6;--ink:#1f2328;--muted:#6b6f76;--line:#e2ded6;--accent:#3949ab;--accent2:#1976d2;--onaccent:#fff;--ok:#2e7d32;--warn:#c77700;--bad:#c62828;--tagbg:#e8eaf6;--tagink:#3949ab}
.vA .shell{display:grid;grid-template-columns:250px 1fr 270px;min-height:100vh}
.vA .rail{background:#23262d;color:#d9dce1;padding:18px 0}
.vA .rail h1{font-size:15px;padding:0 18px 4px;color:#fff}
.vA .rail .sub{padding:0 18px 14px;font-size:12px;color:#9aa0a8}
.vA .rail ol{list-style:none;margin:0;padding:0}
.vA .rail li{display:flex;gap:10px;padding:9px 18px;cursor:pointer;border-left:3px solid transparent}
.vA .rail li:hover{background:#2c3038}
.vA .rail li.cur{background:#2f3440;border-left-color:#8c9eff;color:#fff}
.vA .rail li small{display:block;color:#9aa0a8;font-size:11px}
.vA .rail .num{width:22px;height:22px;border-radius:50%;border:1px solid #59606b;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.vA .rail li.fin .num{background:#2e7d32;border-color:#2e7d32;color:#fff}
.vA .rail .bar{margin:16px 18px 0;height:6px;background:#3a3f49;border-radius:3px;overflow:hidden}
.vA .rail .bar i{display:block;height:100%;background:#8c9eff}
.vA main{padding:24px 32px;max-width:980px}
.vA main .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.vA main h2{font-size:22px}
.vA main .lede{color:var(--muted);margin:0 0 18px}
.vA .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.vA .card h4{font-size:15px;margin-bottom:2px}
.vA .improw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vA .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.vA aside{padding:20px 18px;border-left:1px solid var(--line);background:#fbfaf7}
.vA aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.vA .big{font-size:28px;font-weight:700}
.vA .donebox{color:var(--ok);padding:24px;text-align:center;border:1px dashed var(--ok);border-radius:8px;background:#f1f8f1}

/* ================= Variant B — Inbox ================= */
body.vB{--bg:#0f1216;--panel:#171c22;--field:#1e252d;--ink:#d8dee6;--muted:#7f8a96;--line:#28313b;--accent:#4fd1a5;--accent2:#64b5f6;--onaccent:#06281d;--ok:#4fd1a5;--warn:#f6c453;--bad:#ff6b6b;--tagbg:#24303b;--tagink:#a9c4dc}
.vB .top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#12161b;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.vB .top h1{font:600 14px ui-monospace,Menlo,monospace;color:var(--accent)}
.vB .chips{display:flex;gap:6px;flex-wrap:wrap}
.vB .chip{font:12px ui-monospace,Menlo,monospace;padding:2px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--muted)}
.vB .chip.on{border-color:var(--accent);color:var(--accent)}
.vB .meta{margin-left:auto;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.vB .split{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 50px)}
.vB .list{overflow:auto;border-right:1px solid var(--line)}
.vB .it{display:grid;grid-template-columns:86px 1fr auto;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.vB .it:hover{background:#151a20}
.vB .it.cur{background:#1b2a26;box-shadow:inset 3px 0 0 var(--accent)}
.vB .it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vB .it .s{grid-column:2/4;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vB .it .u{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.vB .it.snz{opacity:.5}
.vB .tag.t-health{background:#3b1f22;color:#ff9b9b}.vB .tag.t-status{background:#2c2a17;color:#f6c453}.vB .tag.t-merge{background:#20283b;color:#9db4ff}
.vB .tag.t-import,.vB .tag.t-manual{background:#173029;color:#7ee0bb}
.vB .detail{overflow:auto;padding:22px 28px}
.vB .detail h2{font-size:19px;margin-bottom:2px}
.vB .detail .lede{color:var(--muted);margin:0 0 16px}
.vB .keys{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.vB kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,Menlo,monospace;color:var(--ink)}
.vB .donefoot{padding:10px 12px;font-size:12px;color:var(--muted)}
.vB .empty{padding:60px 20px;text-align:center;color:var(--ok);font:14px ui-monospace,Menlo,monospace}
.vB .live{background:#2b1d10;color:#ffb86b;padding:6px 16px;font:12px ui-monospace,Menlo,monospace}

/* ================= Variant C — Sport board ================= */
body.vC{--bg:#fff;--panel:#fff;--field:#f7f8fa;--ink:#16191d;--muted:#69717c;--line:#dfe3e8;--accent:#d9480f;--accent2:#1c7ed6;--onaccent:#fff;--ok:#2b8a3e;--warn:#e67700;--bad:#c92a2a;--tagbg:#fff4e6;--tagink:#d9480f}
.vC header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.vC header h1{font-size:18px;letter-spacing:-.01em}
.vC header .tabs{display:flex;gap:2px}
.vC header .tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 10px;font-weight:600;color:var(--muted)}
.vC header .tabs button.on{border-bottom-color:var(--accent);color:var(--ink)}
.vC header .meta{margin-left:auto;font-size:13px;color:var(--muted)}
.vC .wrap{padding:16px 22px}
.vC .board{border:1px solid var(--line);font-size:13px}
.vC .board th{background:#f4f5f7;border-right:1px solid var(--line);text-align:center}
.vC .board th:first-child{text-align:left}
.vC .board td{border-right:1px solid var(--line);text-align:center;vertical-align:middle;padding:0;height:46px}
.vC .board td.sp{text-align:left;padding:6px 10px;min-width:210px}
.vC .board td.sp small{display:block;color:var(--muted);font-size:11px}
.vC .cell{display:flex;align-items:center;justify-content:center;width:100%;height:46px;cursor:pointer;font-weight:700;font-size:15px}
.vC .cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.vC .cell.h1{background:#fff4e6}.vC .cell.h2{background:#ffe8cc}.vC .cell.h3{background:#ffd8a8}
.vC .cell.zero{color:#c4c9d0;font-weight:400;cursor:default}
.vC .cell.zero:hover{outline:none}
.vC .cell.sel{outline:3px solid var(--ink);outline-offset:-3px}
.vC .cell .hc{font-size:11px;font-weight:400;color:var(--muted);text-align:left;line-height:1.2}
.vC .tier{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.vC .quiet{margin-top:10px;font-size:12px;color:var(--muted)}
.vC .drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:#fff;border-left:2px solid var(--ink);box-shadow:-10px 0 30px rgba(0,0,0,.12);overflow:auto;z-index:20;padding:18px 22px 90px}
.vC .drawer h2{font-size:18px}
.vC .drawer .card{border-top:1px solid var(--line);padding:14px 0}
.vC .drawer .card h4{font-size:14px}
.vC .bottom{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.vC .bottom h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.vC .livebar{background:var(--accent);color:#fff;padding:6px 22px;font-weight:600;font-size:13px}
@media (max-width:900px){
  .vA .shell{grid-template-columns:1fr}.vA aside{border-left:0}
  .vB .split{grid-template-columns:1fr;height:auto}
  .vC .bottom{grid-template-columns:1fr}
}
</style>

const ROLES=['—ignore','place','name','nation','performance','points','IF ID','DOB','event','round','opponent','score'];
function parseTable(t){ const lines=t.split(/\r?\n/).filter(l=>l.trim()); const sp=l=>(l.includes('\t')?l.split('\t'):l.split(/\s{2,}|,/)).map(x=>x.trim());
  return {head:sp(lines[0]||''), rows:lines.slice(1).map(sp).filter(r=>r[0]!=='...')}; }
function guessRole(h){ h=h.toLowerCase();
  if(/^(rank|pl|pos|#|place)$/.test(h)) return 'place'; if(/ id$|^id$/.test(h)) return 'IF ID'; if(/name|player|rider|athlete/.test(h)) return 'name';
  if(/^(nat|noc|nf|assoc|member|country|nation)$/.test(h)) return 'nation'; if(/point|pts/.test(h)) return 'points'; if(/time|result|faults|perf|mark/.test(h)) return 'performance';
  if(/dob|birth/.test(h)) return 'DOB'; if(/event/.test(h)) return 'event'; if(/round/.test(h)) return 'round'; if(/opponent/.test(h)) return 'opponent'; if(/score/.test(h)) return 'score'; return '—ignore'; }
function matchRow(get, imp){
  const id=get('IF ID'), key=get('name').toLowerCase().replace(/[^a-z]/g,'');
  const r=id && ROSTER.find(a=>a.ids[imp.idKey]===id); if(r) return {ok:true, how:'IF ID', who:r.name};
  const c=ROSTER.filter(a=>a.sport===imp.sport && key.includes(a.key)); return {ok:false, how:c.length?'name only, no DOB':'no match', cands:c};
}
function importer(imp){
  const st = S.imports[imp.id] ||= {text:imp.sample, map:null, parsed:false, sel:{}};
  let h=`<div class="tool">
   <div class="row"><b>${esc(imp.source)}</b><span class="muted">· ${esc(imp.what)}</span></div>
   <div class="src">${imp.saved?`Column mapping saved for this source (last used ${imp.lastUsed}).`:`<span class="warn">No saved mapping yet: map the columns once and it is saved for this source.</span>`}</div>
   <label>URL of a plain HTML page, or the table copied from the browser</label>
   <input class="url" placeholder="https://…" value="${esc(imp.url)}">
   <textarea rows="6" data-imp-text="${imp.id}">${esc(st.text)}</textarea>
   <div class="row"><button data-act="parse" data-id="${imp.id}" ${st.parsed?'':'data-primary'} class="${st.parsed?'':'primary'}">Read table</button><span class="mock">mock: the sample is pre-pasted</span></div>`;
  if(st.parsed){
    const {head,rows}=parseTable(st.text);
    if(!st.map) st.map = imp.saved && imp.saved.length===head.length ? [...imp.saved] : head.map(guessRole);
    h+=`<label>Columns ${imp.saved?'(saved mapping applied)':'(guessed — check them)'}</label><div class="maps">`+head.map((c,i)=>`<label>${esc(c)}<select data-map="${imp.id}" data-col="${i}">${ROLES.map(r=>`<option ${st.map[i]===r?'selected':''}>${r}</option>`).join('')}</select></label>`).join('')+`</div>`;
    const ni=st.map.indexOf('nation');
    if(ni<0) h+=`<p class="warn">Map a nation column so the BEL rows can be suggested.</p>`;
    else {
      const bel=rows.map((r,idx)=>({r,idx})).filter(x=>(x.r[ni]||'').toUpperCase()==='BEL');
      const shown=['place','round','name','performance','points','opponent','score'].filter(r=>st.map.includes(r));
      h+=`<p>${rows.length} rows read · <b>${bel.length} BEL rows suggested</b> · ${rows.length-bel.length} others skipped</p>
      <table><tr><th></th>${shown.map(r=>`<th>${r}</th>`).join('')}<th>Identity</th></tr>`+bel.map(({r,idx})=>{
        const get=role=>{const i=st.map.indexOf(role);return i<0?'':r[i]||''}; const m=matchRow(get,imp); const on=st.sel[idx]!==false;
        return `<tr><td><input type="checkbox" data-selrow="${imp.id}" data-idx="${idx}" ${on?'checked':''}></td>${shown.map(x=>`<td>${esc(get(x))}</td>`).join('')}
        <td>${m.ok?`<span class="match-ok">✓ ${m.how} → ${esc(m.who)}</span>`:`<span class="match-no">${m.how} → merge queue</span>`}</td></tr>`;}).join('')+`</table>
      <div class="row" style="margin-top:8px"><button class="primary" data-primary data-act="confirm-import" data-id="${imp.id}">Confirm ${bel.filter(b=>st.sel[b.idx]!==false).length} rows</button></div>`;
    }
  }
  return h+`</div>`;
}
function confirmImport(id){
  const imp=[...IMPORTS,LIVE_IMPORT].find(i=>i.id===id); const st=S.imports[id]; const {rows}=parseTable(st.text); const ni=st.map.indexOf('nation');
  let ok=0, q=0;
  rows.forEach((r,idx)=>{ if((r[ni]||'').toUpperCase()!=='BEL'||st.sel[idx]===false) return;
    const get=role=>{const i=st.map.indexOf(role);return i<0?'':r[i]||''}; const m=matchRow(get,imp);
    if(m.ok) ok++; else { q++; S.merge.push({id:'g'+(++S.seq), sport:imp.sport, incoming:{name:get('name'), dob:get('DOB')||'—', src:imp.source+' (paste)', srcId:imp.idKey+' '+get('IF ID'), event:imp.what},
      reason:m.cands.length?'No IF ID match and no date of birth; the name matches.':'No match at all. Possibly a new Athlete: first senior international performance?',
      candidates:m.cands.map(c=>({name:c.name,dob:c.dob||'—',ids:Object.entries(c.ids).map(([k,v])=>k+' '+v).join(' · ')||'no IF ID yet',note:c.sport}))}); }
  });
  if(!imp.saved){ imp.saved=[...st.map]; imp.lastUsed='today'; }
  done(id, `${imp.source}: wrote ${ok} ${imp.kind} rows${q?`, ${q} sent to the merge queue`:''}${imp.lastUsed==='today'?' · mapping saved':''}`);
}

    {t:['merge'],l:'Merge queue',e:'~10 min',d:'Identities the IF ID and name + DOB rules could not settle. Includes what this session\'s imports just sent here.'},
    {t:['status'],l:'Qualification review',e:'0.5–1 h',d:'Only Entries whose ranking or track changed since their last check.'},
    {t:['selection','likely'],l:'Selections & likely',e:'~15 min',d:'Selections from federation press releases, then the likely Participations of the next weeks.'},
    {t:['schedule'],l:'Schedules',e:'~10 min',d:'New timetable versions and Games dates.'},
    {t:['checklist'],l:'Monthly checklist',e:'~15 min',d:'Only the checks due this week.'}],

    {t:['health'],l:'Source health',e:'~2 min',d:'Problems only.'}]

function renderA(){
  const items=buildItems(), steps=STEPS[mode], ui=S.ui.A; if(ui.step>=steps.length) ui.step=0;
  const step=steps[ui.step], its=items.filter(i=>step.t.includes(i.type));
  const total=steps.length, fin=steps.filter((s,i)=>ui.fin[mode+i]||!items.some(x=>s.t.includes(x.type))).length;
  let body='';
  if(step.t[0]==='health'){ body+=`<div class="card">${healthTable()}</div>`+its.map(i=>`<div class="card"><h4>${esc(i.title)}</h4>${i.render()}</div>`).join(''); }
  else if(step.t[0]==='import'){ body+=its.map(i=>`<div class="card"><div class="improw"><div><h4>${esc(i.title)}</h4><div class="src">${esc(i.sub)}</div></div>${ui.open===i.id?'':`<button ${its[0]===i?'class="primary"':''} data-act="a-open" data-id="${i.id}">Open</button>`}</div>${ui.open===i.id?`<div style="margin-top:10px">${i.render()}</div>`:''}</div>`).join(''); }
  else if(step.t[0]==='status'){ body+= its.length?`<div class="card">${statusTable(its)}</div>`:''; }
  else if(step.t[0]==='selection'){ const sel=its.filter(i=>i.type==='selection'), lk=its.filter(i=>i.type==='likely');
    body+=sel.map(i=>`<div class="card"><h4>${esc(i.title)}</h4>${i.render()}</div>`).join('')+(lk.length?`<div class="card"><h4>Likely Participations, next 6 weeks</h4>${likelyTable(lk)}</div>`:''); }
  else body+=its.map(i=>`<div class="card"><h4>${esc(i.title)}</h4><div class="src" style="margin-bottom:6px">${esc(i.sub)}</div>${i.render()}</div>`).join('');
  if(!its.length) body+=`<div class="donebox">✓ Nothing left in this step.</div>`;
  if(step.t[0]==='checklist') body+=`<div class="notdue">${CHECK_NOT_DUE} other checks are not due this week.</div>`;
  const last=ui.step===total-1;
  return `<div class="shell"><nav class="rail"><h1>${mode==='weekly'?'Weekly curation':'Live day pass'}</h1>
   <div class="sub">${mode==='weekly'?`Fri ${TODAY} · week 46`:`${LIVE.comp} · ${LIVE.day}<br><i>${LIVE.note}</i>`}</div>
   <ol>${steps.map((s,i)=>{const n=items.filter(x=>s.t.includes(x.type)).length, f=ui.fin[mode+i]||n===0;return `<li class="${i===ui.step?'cur':''} ${f?'fin':''}" data-act="a-step" data-i="${i}"><span class="num">${f?'✓':i+1}</span><span>${s.l}<small>${s.e} · ${n} open</small></span></li>`}).join('')}</ol>
   <div class="bar"><i style="width:${Math.round(fin/total*100)}%"></i></div><div class="sub" style="padding-top:6px">${fin} of ${total} steps done</div></nav>
  <main><div class="head"><h2>${ui.step+1}. ${step.l}</h2><span class="muted">${step.e} · ${its.length} open</span></div><p class="lede">${step.d}</p>${body}
   <div class="foot"><button class="ghost" data-act="a-prev" ${ui.step===0?'disabled':''}>← Back</button>
   <button class="primary" data-act="a-next">${last?'Finish session':its.length?`Leave ${its.length} for next week, continue →`:'Next step →'}</button></div></main>
  <aside><h3>Estimated time left</h3><div class="big">${fmtMin(minutesLeft(items))}</div><div class="src">${items.length} items open</div>
   <h3>Session log</h3><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('')||'<span class="src">Nothing yet.</span>'}</div></aside></div>`;
}

function render(){
  document.body.className='v'+variant;
  document.getElementById('app').innerHTML = variant==='A'?renderA():variant==='B'?renderB():renderC();
  document.getElementById('switcher').innerHTML = `<button data-sw="-1">◀</button><span class="lbl">${variant} · ${VNAMES[variant]}</span><button data-sw="1">▶</button><span class="sep"></span>
   <button class="${mode==='weekly'?'on':''}" data-mode="weekly">Weekly</button><button class="${mode==='live'?'on':''}" data-mode="live">Live day</button><span class="sep"></span><button data-reset>Reset</button>`;
}
function setURL(){ const p=new URLSearchParams(location.search); p.set('variant',variant); p.set('mode',mode); history.replaceState(null,'','?'+p); }
function cycle(d){ const k='ABC'; variant=k[(k.indexOf(variant)+d+3)%3]; setURL(); render(); }
document.getElementById('switcher').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.sw) cycle(+b.dataset.sw); else if(b.dataset.mode){mode=b.dataset.mode; S.ui.A.step=0; S.ui.B.cur=0; S.ui.C.drawer=null; setURL(); render();} else if('reset' in b.dataset){reset(); render();}});

document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.impText){ const st=S.imports[t.dataset.impText]; st.text=t.value; st.parsed=false; st.map=null; }
  if(t.dataset.selText) S.sel[t.dataset.selText].text=t.value;
  if(t.dataset.selUrl) S.sel[t.dataset.selUrl].url=t.value;
  if(t.dataset.schText){ S.sched[t.dataset.schText].text=t.value; S.sched[t.dataset.schText].parsed=false; }
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.map){ S.imports[t.dataset.map].map[+t.dataset.col]=t.value; render(); }
  if(t.dataset.selrow){ S.imports[t.dataset.selrow].sel[+t.dataset.idx]=t.checked; render(); }
  if(t.dataset.seltick){ S.sel[t.dataset.seltick].ticks[+t.dataset.i]=t.checked; render(); }
});
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  const find=(arr)=>arr.find(x=>x.id===id);
  switch(a){
    case 'h-retry': note(`${find(SOURCES).name}: retry queued (still failing in this mock)`); break;
    case 'h-ack': done('h-'+id, `${find(SOURCES).name}: ${srcState(find(SOURCES))==='blocked'?'kept on Assisted until the block lifts':'acknowledged as stale'}`); break;
    case 'parse': S.imports[id].parsed=true; render(); break;
    case 'confirm-import': confirmImport(id); break;
    case 'manual-save': { const m=find(MANUAL); done(id, `${m.entry}: result saved for ${m.comp}`); break; }
    case 'manual-none': { const m=find(MANUAL); done(id, `${m.entry}: did not compete at ${m.comp} (likely Participation dropped)`); break; }
    case 'merge-link': case 'merge-new': case 'merge-not': { const g=S.merge.find(x=>x.id===id); S.merge=S.merge.filter(x=>x.id!==id);
      done(id, a==='merge-link'?`${g.incoming.name} linked to ${g.candidates[+b.dataset.c].name}; ${g.incoming.srcId} added as external ID`:a==='merge-new'?`New Athlete created: ${g.incoming.name} (Athlete since this result)`:`${g.incoming.name}: marked not an Athlete`); break; }
    case 'st-accept': { const s=find(STATUS); done(id, `${s.entry} (${s.target}): ${s.current} → ${s.suggest} · source ${s.source} · checked today`); break; }
    case 'st-keep': { const s=find(STATUS); done(id, `${s.entry} (${s.target}): kept ${s.current} · checked today`); break; }
    case 'st-set': { const s=find(STATUS), v=document.getElementById('stsel-'+id).value; done(id, `${s.entry} (${s.target}): set to ${v} · checked today`); break; }
    case 'sel-sample': S.sel[id].text=SELECTIONS[0].press; S.sel[id].url='https://example.org/news/selection-ec-short-course'; render(); break;
    case 'sel-find': { const s=find(SELECTIONS), st=S.sel[id]; s.candidates.forEach((c,i)=>{ const k=c.includes('relay')?'relay':c; st.ticks[i]=st.text.toLowerCase().includes(k.toLowerCase()); }); render(); break; }
    case 'sel-save': { const s=find(SELECTIONS), st=S.sel[id], n=Object.values(st.ticks).filter(Boolean).length; done(id, `Selection saved for ${s.comp}: ${n} Selected, ${s.candidates.length-n} Not selected · source ${st.url||'(no URL)'}`); break; }
    case 'lk': { const l=find(LIKELY); done(id, `${l.comp}: ${b.dataset.v.toLowerCase()}`); break; }
    case 'lk-add': note('(mock) would open a form: competition + date + Entry → likely Participation, added by hand'); break;
    case 'sch-parse': S.sched[id].parsed=true; render(); break;
    case 'sch-save': done(id, id==='sch1'?'LA 2028 dates saved (curated, no schedule import yet)':`${ESTC.comp}: timetable stored as v1, Belgian rounds attached, later rounds "if through"`); break;
    case 'ck': { const c=find(CHECK); S.check[id][+b.dataset.i]=b.dataset.v; if(c.sub.every((_,i)=>S.check[id][i])) done(id, `${c.title}: all checked today`); else note(`${c.sub[+b.dataset.i][0]}: ${b.dataset.v}`); break; }
    case 'ck-all': done(id, `${find(CHECK).title}: all checked, no change`); break;
    case 'det-save': done(id, `${find(DETAIL).entry}: match detail saved`); break;
    case 'det-skip': done(id, `${find(DETAIL).entry}: eliminated, later rounds removed`); break;
    case 'tt-accept': done('lv-tt', 'WTTC schedule v4 stored; 2 Belgian matches moved'); break;
    case 'a-step': S.ui.A.step=+b.dataset.i; S.ui.A.open=null; render(); break;
    case 'a-open': S.ui.A.open=id; render(); break;
    case 'a-prev': S.ui.A.step--; S.ui.A.open=null; render(); window.scrollTo(0,0); break;
    case 'a-next': { const ui=S.ui.A; ui.fin[mode+ui.step]=true; if(ui.step<STEPS[mode].length-1) ui.step++; else note('Session finished'); ui.open=null; render(); window.scrollTo(0,0); break; }
    case 'b-filter': S.ui.B.filter=b.dataset.v; S.ui.B.cur=0; render(); break;
    case 'b-pick': S.ui.B.cur=+b.dataset.i; render(); break;
    case 'c-tab': S.ui.C.tab=b.dataset.v; S.ui.C.drawer=null; render(); break;
    case 'c-open': S.ui.C.drawer={sp:b.dataset.sp, c:+b.dataset.c}; render(); break;
    case 'c-close': S.ui.C.drawer=null; render(); break;
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target; if(t.matches&&t.matches('input,textarea,select,[contenteditable]')) return;
  if(e.key==='ArrowLeft') return cycle(-1); if(e.key==='ArrowRight') return cycle(1);
  if(variant==='B'){ const ui=S.ui.B;
    if(e.key==='j'||e.key==='ArrowDown'){ui.cur++;render();e.preventDefault();}
    else if(e.key==='k'||e.key==='ArrowUp'){ui.cur=Math.max(0,ui.cur-1);render();e.preventDefault();}
    else if(e.key==='a'){const p=document.querySelector('.detail [data-primary]'); if(p) p.click();}
    else if(e.key==='s'){const it=document.querySelectorAll('.list .it')[ui.cur]; if(it){const items=buildItems().sort((a,b)=>(!!ui.snz[a.id]-!!ui.snz[b.id])||(a.urg-b.urg)).filter(i=>ui.filter==='all'||i.type===ui.filter); const x=items[ui.cur]; if(x){ui.snz[x.id]=true; render();}}}
  }
  if(variant==='C'&&e.key==='Escape'){S.ui.C.drawer=null;render();}
});
setURL(); render();
</script>
